  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <div id="root"></div>

  <!-- Universal bootloader: In Vite dev mode, imports ./src/main.tsx; in static GitHub Pages, loads ./assets/app.js -->
  <script type="module">
    const isViteDev = window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1' ||
                      window.location.port === '3000' ||
                      window.location.hostname.includes('run.app');

    if (isViteDev) {
      import('./src/main.tsx').catch(err => {
        console.warn('Vite dev import error, falling back to bundled script', err);
        const s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/app.js';
        document.body.appendChild(s);
      });
    } else {
      const s = document.createElement('script');
      s.type = 'module';
      s.crossOrigin = 'anonymous';
      s.src = './assets/app.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
