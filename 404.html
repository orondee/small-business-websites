<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Small Business Sites — Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages Single Page Application redirect script
      // Preserves paths and query parameters across direct refreshes
      var pathSegmentsToKeep = 1; // 1 for repo subpath e.g. /small-business-websites/
      var l = window.location;
      
      // Determine how many path segments to keep based on hostname
      if (!l.hostname.endsWith('github.io')) {
        pathSegmentsToKeep = 0;
      }

      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        encodeURIComponent(redirectPath) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;

      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to application...</p>
  </body>
</html>
